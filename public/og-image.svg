<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Background Glow & Gradients -->
  <circle cx="200" cy="150" r="300" fill="#00E5FF" fill-opacity="0.12" filter="blur(100px)"/>
  <circle cx="1000" cy="500" r="350" fill="#7C3AED" fill-opacity="0.15" filter="blur(120px)"/>
  
  <!-- Grid Lines Overlay -->
  <g opacity="0.1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Glassmorphic Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#171717" fill-opacity="0.7" stroke="#262626" stroke-width="2"/>
  
  <!-- Brand Logo & Badge -->
  <g transform="translate(140, 140)">
    <!-- Windmill Icon Graphic -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logo_grad)"/>
    <path d="M32 16L44 32H20L32 16Z" fill="#0A0A0A"/>
    <path d="M48 32L32 44V20L48 32Z" fill="#0A0A0A"/>
    <path d="M32 48L20 32H44L32 48Z" fill="#0A0A0A"/>
    <path d="M16 32L32 20V44L16 32Z" fill="#0A0A0A"/>
    <text x="84" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em">WINDMILL EXCHANGE</text>
  </g>

  <!-- Protocol Main Headline -->
  <text x="140" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">
    Decentralized Dynamic
  </text>
  <text x="140" y="324" fill="url(#text_grad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">
    Matchmaking Protocol
  </text>

  <!-- Description / Subhead -->
  <text x="140" y="380" fill="#A3A3A3" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" width="600">
    On-chain auction order matching with configurable dynamic pricing curves
  </text>
  <text x="140" y="410" fill="#A3A3A3" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    &amp; autonomous keeper bots across all EVM networks.
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(140, 455)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#262626" stroke="#404040"/>
    <text x="80" y="23" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Dynamic Pricing</text>
    
    <rect x="172" y="0" width="170" height="36" rx="18" fill="#262626" stroke="#404040"/>
    <text x="257" y="23" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Autonomous Keepers</text>
    
    <rect x="354" y="0" width="160" height="36" rx="18" fill="#262626" stroke="#404040"/>
    <text x="434" y="23" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Non-Custodial</text>
  </g>

  <!-- Dynamic Curve Illustration Graphic (Right Side) -->
  <g transform="translate(720, 150)">
    <rect x="0" y="0" width="340" height="330" rx="16" fill="#0A0A0A" fill-opacity="0.8" stroke="#262626"/>
    <!-- Curve Line 1 -->
    <path d="M30 260 Q 120 220 170 120 T 310 50" stroke="url(#curve1)" stroke-width="4" fill="none"/>
    <!-- Curve Line 2 (Counter order) -->
    <path d="M30 60 Q 150 140 220 200 T 310 260" stroke="url(#curve2)" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
    <!-- Intersection Marker -->
    <circle cx="178" cy="132" r="10" fill="#00E5FF"/>
    <circle cx="178" cy="132" r="18" fill="#00E5FF" fill-opacity="0.3"/>
    <text x="195" y="125" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MATCH POINT</text>
  </g>

  <!-- Gradients Definition -->
  <defs>
    <linearGradient id="logo_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text_grad" x1="140" y1="324" x2="600" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="curve1" x1="30" y1="260" x2="310" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="curve2" x1="30" y1="60" x2="310" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
